plugins {
    id 'groovy'
    id 'application'
}

group = 'org.linketinder'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:5.0.8'
    implementation 'org.apache.groovy:groovy-json:5.0.8'
    implementation 'org.postgresql:postgresql:42.7.7'

    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testImplementation 'net.bytebuddy:byte-buddy:1.14.13'
    testImplementation 'org.objenesis:objenesis:3.3'
    testImplementation platform('org.junit:junit-bom:6.0.0')

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.linketinder.cadastro.Main'
    applicationDefaultJvmArgs = ['-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8']
}

test {
    useJUnitPlatform()
}
